name: Receptionist Revenue Autopilot CI

on:
  push:
    branches:
      - feat/receptionist-revenue-autopilot-v1
    paths:
      - "apps/agent/agent/sales/**"
      - "apps/agent/test/sales/**"
      - "apps/agent/scripts/receptionist-autopilot-smoke.ts"
      - "apps/agent/agent/channels/crm.ts"
      - "apps/agent/agent/instructions/task.ts"
      - "apps/agent/agent/lib/tasks.ts"
      - "apps/agent/agent/schedules/dispatch.ts"
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/migrations/**"
      - ".github/workflows/receptionist-autopilot-ci.yml"
  pull_request:
    paths:
      - "apps/agent/agent/sales/**"
      - "apps/agent/test/sales/**"
      - "apps/agent/scripts/receptionist-autopilot-smoke.ts"
      - "apps/agent/agent/channels/crm.ts"
      - "apps/agent/agent/instructions/task.ts"
      - "apps/agent/agent/lib/tasks.ts"
      - "apps/agent/agent/schedules/dispatch.ts"
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/migrations/**"
      - ".github/workflows/receptionist-autopilot-ci.yml"

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_ci

jobs:
  sales-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations to disposable Postgres
        run: cd packages/db && bun run db:deploy

      - name: Run sales unit integration and synthetic proof tests
        run: bun test apps/agent/test/sales

      - name: Run one-command synthetic sale proof
        run: bun apps/agent/scripts/receptionist-autopilot-smoke.ts

      - name: Type-check agent
        run: bun run --filter=agent check-types
